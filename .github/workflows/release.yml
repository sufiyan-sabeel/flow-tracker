name: Release

# Multi-platform release. Triggered by a version tag (v1.7.0) or manually.
#
# Honesty rules baked into this file:
#   * a platform job that fails fails the run, and its artifacts are never
#     attached to the release;
#   * the release notes list, per platform, what was actually built and whether
#     it is signed;
#   * nothing here invents signing credentials. Without the secrets, iOS and
#     macOS artifacts are unsigned and are named as such.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.7.0'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'
  APP_ID: com.flowtracker.app
  # Only this tag may publish. Bump it for the next release; any other tag is
  # rejected in the validate job so a stray tag can never produce a release.
  RELEASE_TAG: v1.5.0

jobs:
  # ---------------------------------------------------------------- validate
  validate:
    name: Validate version and code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from pubspec
        id: version
        run: |
          set -euo pipefail
          line=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          version=${line%%+*}
          build=${line##*+}
          if [ -z "$version" ] || [ -z "$build" ]; then
            echo "::error::pubspec.yaml has no usable version: $line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $version+$build"

      - name: Tag must match pubspec
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="v${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match pubspec version $want"
            exit 1
          fi
          if [ "$TAG" != "${RELEASE_TAG}" ]; then
            echo "::error::tag $TAG is not the release tag ${RELEASE_TAG}; refusing to publish"
            exit 1
          fi
          echo "tag and pubspec agree: $TAG"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter=compact

  # ----------------------------------------------------------------- android
  android:
    name: Android
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure signing when secrets exist
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the release keystore from secrets."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Android keystore secrets; the APK is signed with the debug key and is NOT store-ready."
          fi

      - name: Build release APK
        # universal APK: carries arm64-v8a, armeabi-v7a and x86_64 in one file
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Collect and verify artifacts
        id: collect
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          mkdir -p out
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk" || { echo "::error::no release APK was produced"; exit 1; }
          name="Flow-Tracker-${version}-Android.apk"
          cp "$apk" "out/$name"

          # structural checks: a real APK with a dex and every ABI we claim
          unzip -l "out/$name" > /tmp/apk.txt
          grep -q 'classes.dex' /tmp/apk.txt || { echo "::error::$name has no classes.dex"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -q "lib/${abi}/libapp.so" /tmp/apk.txt \
              || { echo "::error::$name is missing libapp.so for ${abi}"; exit 1; }
            echo "  contains ${abi}"
          done
          # identity: the package id must be the one we ship
          unzip -p "out/$name" AndroidManifest.xml > /tmp/manifest.bin
          strings -e l /tmp/manifest.bin > /tmp/manifest.txt
          grep -qx "${APP_ID}" /tmp/manifest.txt || { echo "::error::$name is not ${APP_ID}"; exit 1; }
          grep -qx "${version}" /tmp/manifest.txt || { echo "::error::$name is not version ${version}"; exit 1; }
          test -s "out/$name" || { echo "::error::$name is empty"; exit 1; }
          echo "verified $name ($(stat -c%s "out/$name") bytes)"

          aab=build/app/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::no AAB produced"; exit 1; }
          cp "$aab" "out/Flow-Tracker-${version}-Android.aab"
          unzip -l "out/Flow-Tracker-${version}-Android.aab" > /tmp/aab.txt
          grep -q 'base/manifest/AndroidManifest.xml' /tmp/aab.txt \
            || { echo "::error::AAB structure is wrong"; exit 1; }
          echo "verified AAB ($(stat -c%s "out/Flow-Tracker-${version}-Android.aab") bytes)"

          echo "signed=${{ steps.signing.outputs.signed }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------- ios
  ios:
    name: iOS
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Show toolchain
        run: |
          xcodebuild -version
          pod --version

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          mkdir -p out Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          name="Flow-Tracker-${version}-iOS-unsigned.ipa"
          zip -qry "out/$name" Payload
          rm -rf Payload

          # verify: the bundle is real and carries the right identity
          unzip -l "out/$name" > /tmp/ipa.txt
          grep -q 'Payload/Runner.app/Runner$' /tmp/ipa.txt \
            || { echo "::error::IPA has no Runner executable"; exit 1; }
          unzip -q -o "out/$name" 'Payload/Runner.app/Info.plist' -d /tmp/ipa
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/ipa/Payload/Runner.app/Info.plist)
          ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/ipa/Payload/Runner.app/Info.plist)
          echo "IPA bundle id: $id, version: $ver"
          [ "$id" = "${APP_ID}" ] || { echo "::error::IPA bundle id $id is not ${APP_ID}"; exit 1; }
          [ "$ver" = "$version" ] || { echo "::error::IPA version $ver is not $version"; exit 1; }
          test -s "out/$name" || { echo "::error::IPA is empty"; exit 1; }
          echo "verified $name ($(stat -f%z "out/$name") bytes) — UNSIGNED"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------- windows
  windows:
    name: Windows
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install packaging tools
        run: |
          choco install innosetup wixtoolset --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build EXE installer
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\out" `
            "windows\installer\flow_tracker.iss"

      - name: Build MSI installer
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          if (-not (Test-Path $src)) { Write-Error "no release folder at $src"; exit 1 }
          New-Item -ItemType Directory -Force -Path out, msi | Out-Null

          # WiX source is generated here rather than harvested with heat: heat's
          # output depends on how the path is passed and kept producing sources
          # light could not resolve. This walks the release folder itself.
          $script:counter = 0
          $script:ids = @()
          function New-DirXml {
            param([string]$Path, [string]$Id, [int]$Depth, [string]$Name = '')
            $pad = ' ' * ($Depth * 2)
            if ([string]::IsNullOrEmpty($Name)) { $Name = Split-Path $Path -Leaf }
            $sb = New-Object System.Text.StringBuilder
            [void]$sb.AppendLine("$pad<Directory Id=`"$Id`" Name=`"$Name`">")
            foreach ($f in Get-ChildItem -Path $Path -File) {
              $script:counter++
              $cid = "c$($script:counter)"
              $script:ids += $cid
              [void]$sb.AppendLine("$pad  <Component Id=`"$cid`" Guid=`"*`">")
              [void]$sb.AppendLine("$pad    <File Id=`"f$($script:counter)`" Source=`"$($f.FullName)`" KeyPath=`"yes`" />")
              [void]$sb.AppendLine("$pad  </Component>")
            }
            $i = 0
            foreach ($d in Get-ChildItem -Path $Path -Directory) {
              $i++
              [void]$sb.Append((New-DirXml -Path $d.FullName -Id "${Id}_$i" -Depth ($Depth + 1)))
            }
            [void]$sb.AppendLine("$pad</Directory>")
            return $sb.ToString()
          }

          $tree = New-DirXml -Path $src -Id 'INSTALLDIR' -Depth 6 -Name 'Flow-tracker'
          $refs = ($script:ids | ForEach-Object { "      <ComponentRef Id=`"$_`" />" }) -join "`n"
          $wxs = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="Flow-tracker" Language="1033" Version="$version"
                     Manufacturer="Umaiz Sufiyan" UpgradeCode="7C1D2A6E-9B34-4C7A-9F2E-6E0B1D5A8C11">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />
              <MajorUpgrade DowngradeErrorMessage="A newer version of Flow-tracker is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
          $tree
                </Directory>
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="AppShortcutDir" Name="Flow-tracker" />
                </Directory>
              </Directory>
              <Feature Id="Main" Title="Flow-tracker" Level="1">
          $refs
                <ComponentRef Id="ApplicationShortcut" />
              </Feature>
              <DirectoryRef Id="AppShortcutDir">
                <Component Id="ApplicationShortcut" Guid="A2B4C6D8-1234-4E5F-9A0B-3C5D7E9F1A2B">
                  <Shortcut Id="AppShortcut" Name="Flow-tracker" Target="[INSTALLDIR]Flow-tracker.exe"
                            WorkingDirectory="INSTALLDIR" />
                  <RemoveFolder Id="AppShortcutDir" On="uninstall" />
                  <RegistryValue Root="HKCU" Key="Software\UmaizSufiyan\Flow-tracker" Name="installed"
                                 Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </DirectoryRef>
            </Product>
          </Wix>
          "@
          Set-Content -Encoding UTF8 msi\product.wxs $wxs
          candle -arch x64 -out msi\product.wixobj msi\product.wxs
          light -out "out\Flow-Tracker-$version-Windows-x64.msi" msi\product.wixobj

      - name: Verify installers
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $exe = "out\Flow-Tracker-$version-Windows-x64.exe"
          $msi = "out\Flow-Tracker-$version-Windows-x64.msi"
          foreach ($f in @($exe, $msi)) {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            if ((Get-Item $f).Length -lt 1MB) { Write-Error "$f is suspiciously small"; exit 1 }
            Write-Host "verified $f ($((Get-Item $f).Length) bytes)"
          }
          # the installer must actually carry the app binary
          $bytes = [System.IO.File]::ReadAllBytes($msi)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains("Flow-tracker.exe")) { Write-Error "MSI does not reference the app binary"; exit 1 }
          $appExe = "build\windows\x64\runner\Release\Flow-tracker.exe"
          if (-not (Test-Path $appExe)) { Write-Error "the built exe is missing"; exit 1 }
          Write-Host "verified the release exe exists"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------- linux
  linux:
    name: Linux
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # gstreamer is required by the audio plugin on Linux; without these the
          # CMake configure step fails before a single line is compiled
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libfuse2 file \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            desktop-file-utils

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package DEB
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/flow-tracker" || { echo "::error::no Linux executable"; exit 1; }
          mkdir -p out
          root=pkg/flow-tracker
          mkdir -p "$root/opt/flow-tracker" "$root/usr/bin" "$root/usr/share/applications" \
                   "$root/usr/share/icons/hicolor/256x256/apps"
          cp -r "$bundle"/* "$root/opt/flow-tracker/"
          ln -s /opt/flow-tracker/flow-tracker "$root/usr/bin/flow-tracker"
          cp linux/com.flowtracker.app.desktop "$root/usr/share/applications/"
          cp assets/icon.png "$root/usr/share/icons/hicolor/256x256/apps/com.flowtracker.app.png"
          mkdir -p "$root/DEBIAN"
          size=$(du -sk "$root/opt" | cut -f1)
          cat > "$root/DEBIAN/control" <<EOF
          Package: flow-tracker
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Umaiz Sufiyan
          Installed-Size: ${size}
          Description: Private, offline habit tracking with reports
           Flow-tracker keeps habits, to-dos and focus sessions on your device and
           exports PDF reports without any account or network connection.
          EOF
          # gzip rather than the default xz: the xz pipe fails on this runner
          # with "tar: stdout: write error" before the package is finished
          dpkg-deb -Zgzip --build --root-owner-group "$root" \
            "out/Flow-Tracker-${version}-Linux-amd64.deb"
          # no pipe to head here: SIGPIPE from head plus `set -o pipefail` fails
          # the step even though the package was built correctly
          dpkg-deb --info "out/Flow-Tracker-${version}-Linux-amd64.deb" > /dev/null
          dpkg-deb --field "out/Flow-Tracker-${version}-Linux-amd64.deb" \
            Package Version Architecture
          dpkg-deb --contents "out/Flow-Tracker-${version}-Linux-amd64.deb" > /tmp/deb.txt
          grep -q 'opt/flow-tracker/flow-tracker' /tmp/deb.txt \
            || { echo "::error::DEB is missing the app binary"; exit 1; }

      - name: Package AppImage
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          bundle=build/linux/x64/release/bundle
          mkdir -p out
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin"
          cp -r "$bundle"/* "$appdir/usr/bin/"
          cp assets/icon.png "$appdir/flow-tracker.png"
          cp assets/icon.png "$appdir/.DirIcon"
          cat > "$appdir/flow-tracker.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Flow-tracker
          Comment=Private, offline habit tracking with reports
          Exec=flow-tracker
          Icon=flow-tracker
          Categories=Utility;Office;
          Terminal=false
          EOF
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/flow-tracker" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          tool=appimagetool-x86_64.AppImage
          curl -fsSL -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$tool"
          ARCH=x86_64 ./"$tool" --appimage-extract-and-run "$appdir" \
            "out/Flow-Tracker-${version}-Linux-x86_64.AppImage"
          rm -f "$tool"

      - name: Verify Linux packages
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          deb="out/Flow-Tracker-${version}-Linux-amd64.deb"
          appimg="out/Flow-Tracker-${version}-Linux-x86_64.AppImage"
          for f in "$deb" "$appimg"; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
            echo "verified $f ($(stat -c%s "$f") bytes)"
          done
          dpkg-deb --field "$deb" Package Version Architecture
          file "$appimg" > /tmp/appimage.txt
          grep -qi 'ELF' /tmp/appimage.txt || { echo "::error::AppImage is not an ELF binary"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------- macos
  macos:
    name: macOS
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS release
        # Flutter writes the Podfile and runs CocoaPods as part of this step, so
        # there is no separate pod install to do first.
        run: flutter build macos --release

      - name: Package DMG and PKG
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          app=build/macos/Build/Products/Release/Flow-tracker.app
          test -d "$app" || { echo "::error::no macOS app bundle"; exit 1; }
          mkdir -p out

          hdiutil create -volname "Flow-tracker" -srcfolder "$app" -ov -format UDZO \
            "out/Flow-Tracker-${version}-macOS-arm64.dmg"

          pkgbuild --component "$app" --install-location /Applications \
            --identifier "${APP_ID}" --version "$version" \
            "out/Flow-Tracker-${version}-macOS-arm64.pkg"

      - name: Verify macOS packages
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          dmg="out/Flow-Tracker-${version}-macOS-arm64.dmg"
          pkg="out/Flow-Tracker-${version}-macOS-arm64.pkg"
          for f in "$dmg" "$pkg"; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
            echo "verified $f ($(stat -f%z "$f") bytes)"
          done
          hdiutil verify "$dmg"
          pkgutil --payload-files "$pkg" > /tmp/pkg.txt
          grep -q 'Flow-tracker.app/Contents/MacOS/Flow-tracker' /tmp/pkg.txt \
            || { echo "::error::PKG payload is missing the app binary"; exit 1; }
          codesign -dv "build/macos/Build/Products/Release/Flow-tracker.app" 2>&1 | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------- release
  publish:
    name: Publish release
    needs: [validate, android, ios, windows, linux, macos]
    # Only publish when every platform built and verified. A failed platform
    # fails the run and nothing is attached on its behalf.
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -la
          count=$(ls -1 | wc -l)
          if [ "$count" -lt 9 ]; then
            echo "::error::expected 9 platform artifacts plus checksums, found $count"
            exit 1
          fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Flow Tracker v${{ needs.validate.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## Flow Tracker v${{ needs.validate.outputs.version }}

            Released ${{ github.event.repository.default_branch }} @ `${{ github.sha }}`.
            Private, offline habit tracking with PDF reports — no account, no
            upload, everything stays on your device.

            ### Release highlights

            - Offline PDF reports: eight report types, six document themes, custom
              date ranges and section toggles, saved or shared from the device.
            - Report statistics corrected: "all history" starts at your first
              record, and habits only count from the day they were created.
            - Rebranded as Flow-tracker with the official mark on the app, the
              documents and every installer.
            - Builds for Android, iOS, Windows, Linux and macOS from one tag.

            ### Downloads

            **Android**

            | File | Architecture | Notes |
            | --- | --- | --- |
            | `Flow-Tracker-${{ needs.validate.outputs.version }}-Android.apk` | arm64-v8a, armeabi-v7a, x86_64 | universal APK, sideload |
            | `Flow-Tracker-${{ needs.validate.outputs.version }}-Android.aab` | universal | for store upload |

            **iOS**

            | File | Architecture | Notes |
            | --- | --- | --- |
