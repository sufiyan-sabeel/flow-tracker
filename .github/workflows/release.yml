name: Release

# Signed, multi-platform release.
#
# Signing policy, enforced in code rather than in comments:
#   * every artifact is signed with a real publisher identity before it is
#     published — there is no debug-key fallback and no unsigned path;
#   * the `preflight` job checks every credential first and fails immediately,
#     naming what is missing, instead of burning forty minutes of builds and then
#     quietly shipping something unsigned;
#   * each platform job verifies its own signature with the platform's own tool
#     (apksigner, jarsigner, codesign, spctl, pkgutil, signtool, gpg) and fails if
#     verification does not pass;
#   * the release notes state the signing status per platform, taken from what
#     actually happened.
#
# See docs/SIGNING.md for the credential list and how to produce each one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.5.0'
        required: true
        type: string
      signing:
        description: 'required = production signing (fails without credentials); unsigned = explicit, labelled test build'
        required: true
        default: required
        type: choice
        options: [required, unsigned]
      scope:
        description: 'android = build and publish Android only; all = every platform'
        required: true
        default: android
        type: choice
        options: [android, all]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.9'
  JAVA_VERSION: '17'
  # A tag push is always production: inputs.signing is empty there, so the
  # default applies. Only a manual dispatch can ask for an unsigned build, and
  # the release notes then say so in the first line.
  SIGNING_MODE: ${{ github.event.inputs.signing || 'required' }}
  # A tag push is a full release. A manual dispatch can ask for Android alone,
  # which must not depend on Apple, Windows or GPG credentials it does not use.
  RELEASE_SCOPE: ${{ github.event.inputs.scope || 'all' }}
  APP_ID: com.flowtracker.app
  # Only this tag may publish. Bump it for the next release.
  RELEASE_TAG: v1.5.0
  # Expected publisher identities, used to check what was actually signed.
  WINDOWS_PUBLISHER: 'Umaiz Sufiyan'

jobs:
  # ---------------------------------------------------------------- preflight
  preflight:
    name: Preflight — version, tests and signing credentials
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      android_sha256: ${{ steps.fingerprints.outputs.android }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from pubspec
        id: version
        run: |
          set -euo pipefail
          line=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          version=${line%%+*}
          build=${line##*+}
          if [ -z "$version" ] || [ -z "$build" ]; then
            echo "::error::pubspec.yaml has no usable version: $line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $version+$build"

      - name: Tag must match pubspec and the release tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          want="v${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match pubspec version $want"
            exit 1
          fi
          if [ "$TAG" != "${RELEASE_TAG}" ]; then
            echo "::error::tag $TAG is not the release tag ${RELEASE_TAG}; refusing to publish"
            exit 1
          fi
          echo "tag, pubspec and RELEASE_TAG agree: $TAG"

      - name: Every signing credential must be present
        if: env.SIGNING_MODE == 'required'
        id: creds
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          check() { if [ -z "${2:-}" ]; then missing+=("$1"); fi; }
          # Android credentials are required for any signed release.
          check ANDROID_KEYSTORE_BASE64       "${ANDROID_KEYSTORE_BASE64:-}"
          check ANDROID_KEYSTORE_PASSWORD     "${ANDROID_KEYSTORE_PASSWORD:-}"
          check ANDROID_KEY_ALIAS             "${ANDROID_KEY_ALIAS:-}"
          check ANDROID_KEY_PASSWORD          "${ANDROID_KEY_PASSWORD:-}"
          # The rest only matter when every platform is being released.
          if [ "${RELEASE_SCOPE}" = "all" ]; then
            check IOS_CERT_P12_BASE64           "${IOS_CERT_P12_BASE64:-}"
            check IOS_CERT_PASSWORD             "${IOS_CERT_PASSWORD:-}"
            check IOS_PROVISION_PROFILE_BASE64  "${IOS_PROVISION_PROFILE_BASE64:-}"
            check IOS_TEAM_ID                   "${IOS_TEAM_ID:-}"
            check WINDOWS_PFX_BASE64            "${WINDOWS_PFX_BASE64:-}"
            check WINDOWS_PFX_PASSWORD          "${WINDOWS_PFX_PASSWORD:-}"
            check GPG_PRIVATE_KEY_BASE64        "${GPG_PRIVATE_KEY_BASE64:-}"
            check GPG_PASSPHRASE                "${GPG_PASSPHRASE:-}"
            check GPG_KEY_ID                    "${GPG_KEY_ID:-}"
            check MACOS_CERT_P12_BASE64         "${MACOS_CERT_P12_BASE64:-}"
            check MACOS_CERT_PASSWORD           "${MACOS_CERT_PASSWORD:-}"
            check MACOS_INSTALLER_P12_BASE64    "${MACOS_INSTALLER_P12_BASE64:-}"
            check MACOS_INSTALLER_PASSWORD      "${MACOS_INSTALLER_PASSWORD:-}"
            check MACOS_TEAM_ID                 "${MACOS_TEAM_ID:-}"
            check MACOS_NOTARY_APPLE_ID         "${MACOS_NOTARY_APPLE_ID:-}"
            check MACOS_NOTARY_PASSWORD         "${MACOS_NOTARY_PASSWORD:-}"
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::refusing to build an unsigned release — missing credentials:"
            for m in "${missing[@]}"; do echo "::error::  $m"; done
            {
              echo "### Signing blocked: ${#missing[@]} credential(s) missing"
              echo ""
              echo "This pipeline does not produce unsigned or debug-signed artifacts."
              echo "Add the following under Settings → Secrets and variables → Actions"
              echo "(environment \`release\`), then re-run:"
              echo ""
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo ""
              echo "See \`docs/SIGNING.md\` for how to produce each value."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "all signing credentials present"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter=compact

      - name: Read the Android signing fingerprint
        if: env.SIGNING_MODE == 'required'
        id: fingerprints
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
          sha=$(keytool -list -v -keystore /tmp/release.jks \
                  -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                  -alias "$ANDROID_KEY_ALIAS" 2>/dev/null \
                | grep -m1 'SHA256:' | sed 's/.*SHA256: //' \
                | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$sha" ]; then
            echo "::error::could not read a SHA-256 fingerprint from the keystore"
            exit 1
          fi
          echo "android=$sha" >> "$GITHUB_OUTPUT"
          echo "Android signing certificate SHA-256: $sha"
          shred -u /tmp/release.jks

  # ----------------------------------------------------------------- android
  android:
    name: Android
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install the production keystore
        if: env.SIGNING_MODE == 'required'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/key.properties android/app/release.jks

      - name: Build signed APK and AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify the APK signature
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          mkdir -p out
          apk=build/app/outputs/flutter-apk/app-release.apk
          name="Flow-Tracker-${version}-Android.apk"
          cp "$apk" "out/$name"

          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using $signer"
          "$signer" verify --verbose --print-certs "out/$name" | tee /tmp/apksigner.txt

          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt \
            || { echo "::error::$name is not v2-signed"; exit 1; }

          if [ "${SIGNING_MODE}" = "required" ]; then
            if grep -qi "CN=Android Debug" /tmp/apksigner.txt; then
              echo "::error::$name is signed with the debug key — refusing to publish"
              exit 1
            fi
            grep -q "${{ needs.preflight.outputs.android_sha256 }}" /tmp/apksigner.txt \
              || { echo "::error::$name is not signed by the expected certificate"; exit 1; }
            echo "APK verified: signed by ${{ needs.preflight.outputs.android_sha256 }}"
          else
            echo "::warning::$name is DEBUG-signed because this is an unsigned test build"
            echo "APK built and structurally verified; signature is not a publisher identity"
          fi

          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "out/$name" | grep -q "lib/${abi}/libapp.so" \
              || { echo "::error::$name is missing libapp.so for ${abi}"; exit 1; }
          done
          unzip -p "out/$name" AndroidManifest.xml > /tmp/manifest.bin
          strings -e l /tmp/manifest.bin > /tmp/manifest.txt
          grep -qx "${APP_ID}" /tmp/manifest.txt || { echo "::error::wrong package id"; exit 1; }
          grep -qx "${version}" /tmp/manifest.txt || { echo "::error::wrong version"; exit 1; }
          echo "APK verified: signed by ${{ needs.preflight.outputs.android_sha256 }}"

      - name: Verify the AAB signature
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          aab=build/app/outputs/bundle/release/app-release.aab
          name="Flow-Tracker-${version}-Android.aab"
          cp "$aab" "out/$name"

          # -strict is deliberately not used: Android signing certificates are
          # self-signed, so PKIX validation always reports "signer errors" even
          # for a correct production signature.
          jarsigner -verify -verbose -certs "out/$name" > /tmp/jarsigner.txt 2>&1 || true
          grep -q "jar verified" /tmp/jarsigner.txt \
            || { cat /tmp/jarsigner.txt; echo "::error::AAB is not signed"; exit 1; }

          keytool -printcert -jarfile "out/$name" > /tmp/aabcert.txt 2>&1 \
            || { cat /tmp/aabcert.txt; echo "::error::could not read the AAB signer"; exit 1; }
          aab_sha=$(grep -m1 'SHA256:' /tmp/aabcert.txt | sed 's/.*SHA256: //' \
                    | tr -d ':' | tr 'A-F' 'a-f')
          echo "AAB signer SHA-256: $aab_sha"

          if [ "${SIGNING_MODE}" = "required" ]; then
            [ "$aab_sha" = "${{ needs.preflight.outputs.android_sha256 }}" ] \
              || { echo "::error::AAB is not signed by the expected certificate"; exit 1; }
            if grep -qi "CN=Android Debug" /tmp/aabcert.txt; then
              echo "::error::AAB is signed with the debug key — refusing to publish"
              exit 1
            fi
            echo "AAB verified: signed by $aab_sha"
          else
            echo "::warning::AAB is debug-signed (unsigned test build)"
          fi
          unzip -l "out/$name" > /tmp/aab.txt
          grep -q 'base/manifest/AndroidManifest.xml' /tmp/aab.txt \
            || { echo "::error::AAB structure is wrong"; exit 1; }
          echo "AAB verified with jarsigner"

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------- ios
  ios:
    name: iOS
    needs: preflight
    if: (github.event.inputs.scope || 'all') == 'all'
    runs-on: macos-latest
    timeout-minutes: 50
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Import the Apple Distribution certificate and profile
        if: env.SIGNING_MODE == 'required'
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$IOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          echo "identities available:"
          security find-identity -v -p codesigning "$keychain"

      - name: Write the export options
        if: env.SIGNING_MODE == 'required'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          plutil -lint ios/ExportOptions.plist

      - name: Build and export a signed IPA
        if: env.SIGNING_MODE == 'required'
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Build an unsigned iOS app
        if: env.SIGNING_MODE == 'unsigned'
        run: |
          echo "::warning::Building without signing — this IPA cannot be installed on a device"
          flutter build ios --release --no-codesign

      - name: Package an unsigned IPA
        if: env.SIGNING_MODE == 'unsigned'
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          mkdir -p out Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "out/Flow-Tracker-${version}-iOS-unsigned.ipa" Payload
          rm -rf Payload
          unzip -l "out/Flow-Tracker-${version}-iOS-unsigned.ipa" > /tmp/ipa.txt
          grep -q 'Payload/Runner.app/Runner$' /tmp/ipa.txt \
            || { echo "::error::IPA has no Runner executable"; exit 1; }
          echo "packaged unsigned IPA for structure checks only"

      - name: Verify the IPA signature and provisioning
        if: env.SIGNING_MODE == 'required'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          mkdir -p out
          ipa=$(ls build/ios/ipa/*.ipa | head -1)
          name="Flow-Tracker-${version}-iOS.ipa"
          cp "$ipa" "out/$name"

          work=$RUNNER_TEMP/ipa
          rm -rf "$work"; mkdir -p "$work"
          unzip -q "out/$name" -d "$work"
          app="$work/Payload/Runner.app"
          test -d "$app" || { echo "::error::IPA has no Payload/Runner.app"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$app" \
            || { echo "::error::codesign verification failed"; exit 1; }
          echo "--- signing identity ---"
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/codesign.txt
          grep -q "Authority=Apple Distribution" /tmp/codesign.txt \
            || { echo "::error::IPA is not signed with an Apple Distribution certificate"; exit 1; }
          grep -q "TeamIdentifier=${IOS_TEAM_ID}" /tmp/codesign.txt \
            || { echo "::error::IPA team identifier does not match"; exit 1; }

          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          [ "$id" = "${APP_ID}" ] || { echo "::error::bundle id $id is not ${APP_ID}"; exit 1; }
          [ "$ver" = "$version" ] || { echo "::error::version $ver is not $version"; exit 1; }

          echo "--- embedded provisioning profile ---"
          security cms -D -i "$app/embedded.mobileprovision" > /tmp/profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/profile.plist \
            | grep -qx "${IOS_TEAM_ID}" || { echo "::error::profile team does not match"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/profile.plist

          echo "IPA verified: signed, provisioning profile embedded"

      - name: Remove the signing keychain
        if: always() && env.SIGNING_MODE == 'required'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------- windows
  windows:
    name: Windows
    needs: preflight
    if: (github.event.inputs.scope || 'all') == 'all'
    runs-on: windows-latest
    timeout-minutes: 50
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install packaging tools
        run: |
          choco install innosetup wixtoolset --no-progress -y

      - name: Build EXE installer
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\out" `
            "windows\installer\flow_tracker.iss"

      - name: Build MSI installer
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          $src = Join-Path $PWD 'build\windows\x64\runner\Release'
          if (-not (Test-Path $src)) { Write-Error "no release folder at $src"; exit 1 }
          New-Item -ItemType Directory -Force -Path out, msi | Out-Null

          $script:counter = 0
          $script:ids = @()
          function New-DirXml {
            param([string]$Path, [string]$Id, [int]$Depth, [string]$Name = '')
            $pad = ' ' * ($Depth * 2)
            if ([string]::IsNullOrEmpty($Name)) { $Name = Split-Path $Path -Leaf }
            $sb = New-Object System.Text.StringBuilder
            [void]$sb.AppendLine("$pad<Directory Id=`"$Id`" Name=`"$Name`">")
            foreach ($f in Get-ChildItem -Path $Path -File) {
              $script:counter++
              $cid = "c$($script:counter)"
              $script:ids += $cid
              [void]$sb.AppendLine("$pad  <Component Id=`"$cid`" Guid=`"*`">")
              [void]$sb.AppendLine("$pad    <File Id=`"f$($script:counter)`" Source=`"$($f.FullName)`" KeyPath=`"yes`" />")
              [void]$sb.AppendLine("$pad  </Component>")
            }
            $i = 0
            foreach ($d in Get-ChildItem -Path $Path -Directory) {
              $i++
              [void]$sb.Append((New-DirXml -Path $d.FullName -Id "${Id}_$i" -Depth ($Depth + 1)))
            }
            [void]$sb.AppendLine("$pad</Directory>")
            return $sb.ToString()
          }

          $tree = New-DirXml -Path $src -Id 'INSTALLDIR' -Depth 6 -Name 'Flow-tracker'
          $refs = ($script:ids | ForEach-Object { "      <ComponentRef Id=`"$_`" />" }) -join "`n"
          $wxs = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="Flow-tracker" Language="1033" Version="$version"
                     Manufacturer="Umaiz Sufiyan" UpgradeCode="7C1D2A6E-9B34-4C7A-9F2E-6E0B1D5A8C11">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" />
              <MajorUpgrade DowngradeErrorMessage="A newer version of Flow-tracker is already installed." />

              <!-- The audioplayers plugin uses Windows Media Foundation. On an
                   edition without it the app cannot start at all, so refuse the
                   install with an explanation rather than leaving a dead icon. -->
              <Property Id="MFPLAT_DLL">
                <DirectorySearch Id="SystemDirSearch" Path="[System64Folder]">
                  <FileSearch Id="mfplatSearch" Name="mfplat.dll" />
                </DirectorySearch>
              </Property>
              <Condition Message="Flow-tracker needs Windows Media Foundation for its focus sounds, and this edition of Windows does not include it. Install the Media Feature Pack (Settings &gt; Apps &gt; Optional features &gt; Add a feature), then run this installer again. PowerShell: DISM /Online /Add-Capability /CapabilityName:Media.MediaFeaturePack~~~~0.0.1.0">
                <![CDATA[MFPLAT_DLL]]>
              </Condition>
              <MediaTemplate EmbedCab="yes" />
              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFiles64Folder">
          $tree
                </Directory>
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="AppShortcutDir" Name="Flow-tracker" />
                </Directory>
              </Directory>
              <Feature Id="Main" Title="Flow-tracker" Level="1">
          $refs
                <ComponentRef Id="ApplicationShortcut" />
              </Feature>
              <DirectoryRef Id="AppShortcutDir">
                <Component Id="ApplicationShortcut" Guid="A2B4C6D8-1234-4E5F-9A0B-3C5D7E9F1A2B">
                  <Shortcut Id="AppShortcut" Name="Flow-tracker" Target="[INSTALLDIR]Flow-tracker.exe"
                            WorkingDirectory="INSTALLDIR" />
                  <RemoveFolder Id="AppShortcutDir" On="uninstall" />
                  <RegistryValue Root="HKCU" Key="Software\UmaizSufiyan\Flow-tracker" Name="installed"
                                 Type="integer" Value="1" KeyPath="yes" />
                </Component>
              </DirectoryRef>
            </Product>
          </Wix>
          "@
          Set-Content -Encoding UTF8 msi\product.wxs $wxs
          candle -arch x64 -out msi\product.wixobj msi\product.wxs
          light -out "out\Flow-Tracker-$version-Windows-x64.msi" msi\product.wixobj
          Remove-Item "out\*.wixpdb" -ErrorAction SilentlyContinue

      - name: Authenticode-sign the installers
        if: env.SIGNING_MODE == 'required'
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))

          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          Write-Host "using $signtool"

          $version = "${{ needs.preflight.outputs.version }}"
          foreach ($f in @("out\Flow-Tracker-$version-Windows-x64.exe", "out\Flow-Tracker-$version-Windows-x64.msi")) {
            & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD `
                /tr http://timestamp.digicert.com /td SHA256 /v $f
            if ($LASTEXITCODE -ne 0) { Write-Error "signing failed for $f"; exit 1 }
          }
          Remove-Item $pfx -Force

      - name: Verify the Authenticode signatures
        if: env.SIGNING_MODE == 'required'
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $version = "${{ needs.preflight.outputs.version }}"
          foreach ($f in @("out\Flow-Tracker-$version-Windows-x64.exe", "out\Flow-Tracker-$version-Windows-x64.msi")) {
            & $signtool verify /pa /all /v $f
            if ($LASTEXITCODE -ne 0) { Write-Error "signature verification failed for $f"; exit 1 }
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { Write-Error "$f status is $($sig.Status)"; exit 1 }
            $subject = $sig.SignerCertificate.Subject
            Write-Host "$f -> $subject"
            if ($subject -notmatch "${{ env.WINDOWS_PUBLISHER }}") {
              Write-Error "$f was not signed by ${{ env.WINDOWS_PUBLISHER }} (got $subject)"
              exit 1
            }
            if ($sig.TimeStamperCertificate -eq $null) {
              Write-Error "$f is not timestamped"
              exit 1
            }
            Write-Host "thumbprint: $($sig.SignerCertificate.Thumbprint)"
          }

      - name: Check the unsigned installers
        if: env.SIGNING_MODE == 'unsigned'
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.preflight.outputs.version }}"
          foreach ($f in @("out\Flow-Tracker-$version-Windows-x64.exe", "out\Flow-Tracker-$version-Windows-x64.msi")) {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
            if ((Get-Item $f).Length -lt 1MB) { Write-Error "$f is suspiciously small"; exit 1 }
            $sig = Get-AuthenticodeSignature $f
            Write-Host "$f signature status: $($sig.Status) (expected: NotSigned in unsigned mode)"
            Write-Host "  size: $((Get-Item $f).Length) bytes"
          }
          Write-Warning "Installers are UNSIGNED: SmartScreen will report an unknown publisher"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*
            !out/*.wixpdb
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------- linux
  linux:
    name: Linux
    needs: preflight
    if: (github.event.inputs.scope || 'all') == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build dependencies
        # The hosted image ships usable package lists; try those first and only
        # refresh the indexes if the install actually fails, so a slow mirror
        # cannot stall the job.
        timeout-minutes: 15
        run: |
          set -x
          packages="clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libfuse2 file desktop-file-utils \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev"
          if ! sudo apt-get install -y --no-install-recommends \
                 -o Acquire::Retries=2 -o Acquire::http::Timeout=25 $packages; then
            echo "install from cached indexes failed; refreshing once"
            timeout 240 sudo apt-get update \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=20 || true
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=25 $packages
          fi
          pkg-config --exists gtk+-3.0 && echo "gtk3 dev present"
          pkg-config --exists gstreamer-1.0 && echo "gstreamer dev present"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package DEB
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/flow-tracker" || { echo "::error::no Linux executable"; exit 1; }
          mkdir -p out
          root=pkg/flow-tracker
          mkdir -p "$root/opt/flow-tracker" "$root/usr/bin" "$root/usr/share/applications" \
                   "$root/usr/share/icons/hicolor/256x256/apps"
          cp -r "$bundle"/* "$root/opt/flow-tracker/"
          ln -s /opt/flow-tracker/flow-tracker "$root/usr/bin/flow-tracker"
          cp linux/com.flowtracker.app.desktop "$root/usr/share/applications/"
          cp assets/icon.png "$root/usr/share/icons/hicolor/256x256/apps/com.flowtracker.app.png"
          mkdir -p "$root/DEBIAN"
          size=$(du -sk "$root/opt" | cut -f1)
          cat > "$root/DEBIAN/control" <<EOF
          Package: flow-tracker
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Umaiz Sufiyan
          Installed-Size: ${size}
          Description: Private, offline habit tracking with reports
           Flow-tracker keeps habits, to-dos and focus sessions on your device and
           exports PDF reports without any account or network connection.
          EOF
          dpkg-deb -Zgzip --build --root-owner-group "$root" \
            "out/Flow-Tracker-${version}-Linux-amd64.deb"
          dpkg-deb --info "out/Flow-Tracker-${version}-Linux-amd64.deb" > /dev/null
          dpkg-deb --field "out/Flow-Tracker-${version}-Linux-amd64.deb" Package Version Architecture
          dpkg-deb --contents "out/Flow-Tracker-${version}-Linux-amd64.deb" > /tmp/deb.txt
          grep -q 'opt/flow-tracker/flow-tracker' /tmp/deb.txt \
            || { echo "::error::DEB is missing the app binary"; exit 1; }

      - name: Package AppImage
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          bundle=build/linux/x64/release/bundle
          mkdir -p out
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin"
          cp -r "$bundle"/* "$appdir/usr/bin/"
          cp assets/icon.png "$appdir/flow-tracker.png"
          cp assets/icon.png "$appdir/.DirIcon"
          cat > "$appdir/flow-tracker.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Flow-tracker
          Comment=Private, offline habit tracking with reports
          Exec=flow-tracker
          Icon=flow-tracker
          Categories=Utility;Office;
          Terminal=false
          EOF
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/flow-tracker" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          tool=appimagetool-x86_64.AppImage
          curl -fsSL -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$tool"
          ARCH=x86_64 ./"$tool" --appimage-extract-and-run "$appdir" \
            "out/Flow-Tracker-${version}-Linux-x86_64.AppImage"
          rm -f "$tool"

      - name: Sign the packages with GPG
        if: env.SIGNING_MODE == 'required'
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
          echo "signing key:"
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}'

          # detached signature for each package, plus the checksum manifest
          for f in out/*.deb out/*.AppImage; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$GPG_KEY_ID" --armor --detach-sign "$f"
            gpg --verify "$f.asc" "$f"
          done

          gpg --armor --export "$GPG_KEY_ID" > out/flow-tracker-signing-key.asc
          gpg --show-keys --with-fingerprint out/flow-tracker-signing-key.asc

      - name: Verify the Linux packages and signatures
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          version="${{ needs.preflight.outputs.version }}"
          deb="out/Flow-Tracker-${version}-Linux-amd64.deb"
          appimg="out/Flow-Tracker-${version}-Linux-x86_64.AppImage"
          for f in "$deb" "$appimg"; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
            if [ "${SIGNING_MODE}" = "required" ]; then
              test -s "$f.asc" || { echo "::error::$f has no detached signature"; exit 1; }
              gpg --verify "$f.asc" "$f" || { echo "::error::signature check failed for $f"; exit 1; }
              echo "verified $f ($(stat -c%s "$f") bytes) with $(basename "$f").asc"
            else
              echo "verified structure of $f ($(stat -c%s "$f") bytes); no signature in unsigned mode"
            fi
          done
          file "$appimg" > /tmp/appimage.txt
          grep -qi 'ELF' /tmp/appimage.txt || { echo "::error::AppImage is not an ELF binary"; exit 1; }

      - name: Remove the signing key from the runner
        if: always() && env.SIGNING_MODE == 'required'
        run: rm -rf "$RUNNER_TEMP/gnupg"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------- macos
  macos:
    name: macOS
    needs: preflight
    if: (github.event.inputs.scope || 'all') == 'all'
    runs-on: macos-latest
    timeout-minutes: 50
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Import the Developer ID certificates
        if: env.SIGNING_MODE == 'required'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
        run: |
          set -euo pipefail
          keychain=$RUNNER_TEMP/macos-signing.keychain-db
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/app.p12"
          echo "$MACOS_INSTALLER_P12_BASE64" | base64 -d > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$MACOS_INSTALLER_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          echo "identities available:"
          security find-identity -v -p codesigning "$keychain"

      - name: Build the macOS app
        run: flutter build macos --release

      - name: Sign the app with Developer ID Application
        if: env.SIGNING_MODE == 'required'
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/Flow-tracker.app
          test -d "$app" || { echo "::error::no macOS app bundle"; exit 1; }
          identity=$(security find-identity -v -p codesigning "$RUNNER_TEMP/macos-signing.keychain-db" \
                     | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the keychain"; exit 1
          fi
          echo "signing with: $identity"
          # inside-out: frameworks and helpers first, then the bundle
          find "$app/Contents/Frameworks" -maxdepth 1 -name '*.framework' -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --timestamp --options runtime --sign "$identity" {}
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/macos-codesign.txt

      - name: Package DMG and PKG
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          app=build/macos/Build/Products/Release/Flow-tracker.app
          mkdir -p out
          hdiutil create -volname "Flow-tracker" -srcfolder "$app" -ov -format UDZO \
            "out/Flow-Tracker-${version}-macOS-arm64.dmg"

          if [ "${SIGNING_MODE}" = "required" ]; then
            installer_identity=$(security find-identity -v -p basic "$RUNNER_TEMP/macos-signing.keychain-db" \
                                  | grep "Developer ID Installer" | head -1 | sed -E 's/.*"(.*)"/\1/')
            if [ -z "$installer_identity" ]; then
              echo "::error::no Developer ID Installer identity in the keychain"; exit 1
            fi
            pkgbuild --component "$app" --install-location /Applications \
              --identifier "${APP_ID}" --version "$version" \
              --sign "$installer_identity" \
              "out/Flow-Tracker-${version}-macOS-arm64.pkg"
            # sign the disk image too, so the download itself carries a signature
            codesign --force --timestamp --sign "$installer_identity" \
              "out/Flow-Tracker-${version}-macOS-arm64.dmg"
          else
            echo "::warning::Packaging unsigned DMG and PKG"
            pkgbuild --component "$app" --install-location /Applications \
              --identifier "${APP_ID}" --version "$version" \
              "out/Flow-Tracker-${version}-macOS-arm64.pkg"
          fi

      - name: Notarize and staple
        if: env.SIGNING_MODE == 'required'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          for f in "out/Flow-Tracker-${version}-macOS-arm64.pkg" "out/Flow-Tracker-${version}-macOS-arm64.dmg"; do
            echo "submitting $f for notarization"
            xcrun notarytool submit "$f" \
              --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --password "$MACOS_NOTARY_PASSWORD" \
              --team-id "$MACOS_TEAM_ID" \
              --wait --timeout 30m
            xcrun stapler staple "$f" || {
              echo "::error::stapling failed for $f"; exit 1; }
            xcrun stapler validate "$f"
          done

      - name: Verify Gatekeeper acceptance
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          app=build/macos/Build/Products/Release/Flow-tracker.app
          pkg="out/Flow-Tracker-${version}-macOS-arm64.pkg"
          dmg="out/Flow-Tracker-${version}-macOS-arm64.dmg"

          hdiutil verify "$dmg"
          pkgutil --payload-files "$pkg" > /tmp/pkg.txt
          grep -q 'Flow-tracker.app/Contents/MacOS/Flow-tracker' /tmp/pkg.txt \
            || { echo "::error::PKG payload is missing the app binary"; exit 1; }

          if [ "${SIGNING_MODE}" = "required" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            pkgutil --check-signature "$pkg" | tee /tmp/pkg-signature.txt
            grep -q "Developer ID Installer" /tmp/pkg-signature.txt \
              || { echo "::error::PKG is not signed by Developer ID Installer"; exit 1; }
            spctl --assess --type install --verbose=4 "$pkg"
            echo "macOS artifacts signed, notarized, stapled and accepted by Gatekeeper"
          else
            echo "::warning::macOS artifacts are unsigned and not notarized (test build)"
            echo "package structure verified; Gatekeeper will require right-click → Open"
          fi

      - name: Remove the signing keychain
        if: always() && env.SIGNING_MODE == 'required'
        run: security delete-keychain "$RUNNER_TEMP/macos-signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ----------------------------------------------------------------- release
  publish:
    name: Publish release
    needs: [preflight, android, ios, windows, linux, macos]
    # Production: every platform must have built AND passed signature
    # verification — no partial release. Unsigned test mode: publish whatever
    # actually built, and the notes list what is missing. It is never silent.
    if: |
      always() && needs.preflight.result == 'success' && (
        ((github.event.inputs.scope || 'all') == 'android' && needs.android.result == 'success') ||
        ((github.event.inputs.scope || 'all') == 'all' &&
         (github.event.inputs.signing || 'required') == 'required' && success()) ||
        ((github.event.inputs.scope || 'all') == 'all' &&
         (github.event.inputs.signing || 'required') == 'unsigned')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Summarise which platforms built
        id: platforms
        run: |
          set -euo pipefail
          built=""; missing=""
          for pair in "android:${{ needs.android.result }}" "ios:${{ needs.ios.result }}" \
                      "windows:${{ needs.windows.result }}" "linux:${{ needs.linux.result }}" \
                      "macos:${{ needs.macos.result }}"; do
            name=${pair%%:*}; result=${pair##*:}
            if [ "$result" = "success" ]; then
              built="$built $name"
            else
              missing="$missing $name ($result)"
            fi
          done
          echo "built:$built"
          echo "missing:$missing"
          echo "built=${built# }" >> "$GITHUB_OUTPUT"
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          ls -la
          count=$(ls -1 | wc -l)

          if [ "${RELEASE_SCOPE}" = "android" ]; then
            # Android ships two files; the other platforms are untouched.
            want=2
          elif [ "${SIGNING_MODE}" = "required" ]; then
            # 9 artifacts + 2 .asc + public key, before this manifest is written
            want=12
          else
            platforms=$(echo "${{ steps.platforms.outputs.built }}" | wc -w)
            want=$(( platforms * 2 - 1 ))
          fi
          echo "found $count files, expecting at least $want"
          if [ "$count" -lt "$want" ]; then
            echo "::error::expected at least $want files, found $count"
            exit 1
          fi

          if [ "${RELEASE_SCOPE}" = "android" ]; then
            # Replacing the Android assets must not drop the checksums of the
            # iOS/Windows/Linux/macOS files that stay on the release.
            mkdir -p /tmp/old
            gh release download "$TAG" --pattern SHA256SUMS.txt --dir /tmp/old --clobber 2>/dev/null || true
            python3 - <<'EOF'
          import hashlib, pathlib
          old = pathlib.Path('/tmp/old/SHA256SUMS.txt')
          previous = old.read_text().splitlines() if old.exists() else []
          mine = sorted(
              p for p in pathlib.Path('.').iterdir()
              if p.is_file() and p.suffix in ('.apk', '.aab')
          )
          names = {p.name for p in mine}
          kept = [line for line in previous if line.split() and line.split()[-1] not in names]
          for path in mine:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              kept.append(f"{digest}  {path.name}")
          pathlib.Path('SHA256SUMS.txt').write_text("\n".join(kept) + "\n")
          print(f"manifest covers {len(kept)} files")
          EOF
          else
            sha256sum * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Publish the Android assets
        if: env.SIGNING_MODE == 'required' && env.RELEASE_SCOPE == 'android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Flow Tracker v${{ needs.preflight.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## Flow Tracker v${{ needs.preflight.outputs.version }} — Android

            Production-signed Android build from `${{ github.sha }}`.

            | File | Identity | Verification |
            | --- | --- | --- |
            | `Flow-Tracker-${{ needs.preflight.outputs.version }}-Android.apk` | release keystore `${{ needs.preflight.outputs.android_sha256 }}` | `apksigner verify` (v2, fingerprint matched) |
            | `Flow-Tracker-${{ needs.preflight.outputs.version }}-Android.aab` | same keystore | `jarsigner -verify` + `keytool -printcert` |

            The iOS, Windows, Linux and macOS files on this release are unchanged
            from the previous build; only the Android assets were replaced. Their
            checksums are preserved in `SHA256SUMS.txt`.

            ### Install

            Open the APK on the device and allow install from this source. This
            build is signed with the permanent release key, so it updates the
            previously installed debug-signed copy only after an uninstall —
            Android refuses a signature change in place.

            ### Verify

            ```
            sha256sum -c SHA256SUMS.txt
            apksigner verify --print-certs Flow-Tracker-${{ needs.preflight.outputs.version }}-Android.apk
            ```

      - name: Publish the signed release
        if: env.SIGNING_MODE == 'required' && env.RELEASE_SCOPE == 'all'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Flow Tracker v${{ needs.preflight.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            ## Flow Tracker v${{ needs.preflight.outputs.version }}

            Built from `${{ github.sha }}`. Private, offline habit tracking with PDF
            reports — no account, no upload, everything stays on your device.

            **Signing: production.** Every artifact was signed with the project's
            publisher identity and verified during the build. Nothing unsigned is
            attached.

            | Platform | Identity | Verification |
            | --- | --- | --- |
            | Android | release keystore `${{ needs.preflight.outputs.android_sha256 }}` | `apksigner verify` (APK), `jarsigner -verify` (AAB) |
            | iOS | Apple Distribution certificate | `codesign --verify`, embedded provisioning profile inspected |
            | Windows | Authenticode, publisher `Umaiz Sufiyan` | `signtool verify /pa /all`, timestamp present |
            | Linux | project GPG key (public key attached) | detached `.asc` verified with the published key |
            | macOS | Developer ID Application + Installer | `codesign`, `pkgutil --check-signature`, `spctl`, notarized and stapled |

            ### Downloads

            | Platform | File |
            | --- | --- |
            | Android | `Flow-Tracker-${{ needs.preflight.outputs.version }}-Android.apk` (universal), `-Android.aab` |
            | iOS | `Flow-Tracker-${{ needs.preflight.outputs.version }}-iOS.ipa` |
            | Windows | `Flow-Tracker-${{ needs.preflight.outputs.version }}-Windows-x64.exe`, `-Windows-x64.msi` |
            | Linux | `Flow-Tracker-${{ needs.preflight.outputs.version }}-Linux-x86_64.AppImage`, `-Linux-amd64.deb` |
            | macOS | `Flow-Tracker-${{ needs.preflight.outputs.version }}-macOS-arm64.dmg`, `-macOS-arm64.pkg` |

            Signature files: `.asc` next to each Linux package, plus
            `flow-tracker-signing-key.asc` and `SHA256SUMS.txt`.

            ### Verify a download

            ```
            sha256sum -c SHA256SUMS.txt
            gpg --import flow-tracker-signing-key.asc
            gpg --verify Flow-Tracker-${{ needs.preflight.outputs.version }}-Linux-amd64.deb.asc \
                         Flow-Tracker-${{ needs.preflight.outputs.version }}-Linux-amd64.deb
            ```

            The AppImage carries its own detached signature; it is a separate
            signature over a separate file, not the DEB's reused.

            ### Installation

            - **Android**: open the APK on the device and allow install from this source.
            - **iOS**: signed for App Store distribution; install via TestFlight or a
              profile that includes your device.
            - **Windows**: run the `.exe` or `.msi`. SmartScreen reputation builds over
              time and is not guaranteed.
            - **Linux**: `sudo apt install ./Flow-Tracker-*.deb`, or
              `chmod +x Flow-Tracker-*.AppImage && ./Flow-Tracker-*.AppImage`.
            - **macOS**: open the DMG and drag the app to Applications, or run the PKG.
              Signed, notarized and stapled, so Gatekeeper accepts it on first launch.

            ### Known limitations

            - SmartScreen reputation is earned over time, not granted by signing.
            - No physical iPhone, Mac or Windows machine was used to test these builds.
            - Home-screen widgets and scheduled reminders are Android/iOS features;
              the desktop builds run without them.

      - name: Publish the unsigned test build
