            ### Installation

            - **Android**: open the APK on the device and allow install from this
              source.
            - **iOS**: the IPA is unsigned and cannot be installed as-is; re-sign it
              with your own Apple team, or build from source.
            - **Windows**: run the `.exe` or the `.msi`. SmartScreen will warn
              because the installers are unsigned.
            - **Linux**: `chmod +x Flow-Tracker-*.AppImage && ./Flow-Tracker-*.AppImage`,
              or `sudo apt install ./Flow-Tracker-*.deb`.
            - **macOS**: open the DMG and drag the app to Applications, or run the
              PKG. Right-click → Open the first time; it is not notarized.

            ### SHA256 checksums

            `SHA256SUMS.txt` is attached. Verify with:

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            ### Signing status

            | Platform | Status |
            | --- | --- |
            | Android | signed with the project keystore when the signing secrets are configured; otherwise the debug key |
            | iOS | **unsigned** — no Apple certificate or provisioning profile is configured in CI |
            | Windows | unsigned; SmartScreen will warn |
            | Linux | unsigned, which is normal for AppImage and DEB |
            | macOS | **unsigned and not notarized**; Gatekeeper requires right-click → Open |

            ### Known limitations

            - iOS and macOS artifacts are unsigned: they are real builds, but not
              distributable without your own signing identity.
            - No physical iPhone, Mac or Windows machine was used to test these
              builds; they are compiled and packaged on GitHub runners.
            - Home-screen widgets and scheduled reminders are Android/iOS features;
              the desktop builds run without them.
